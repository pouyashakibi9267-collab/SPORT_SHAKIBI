<!doctype html>
<html lang="fa" dir="rtl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SPORT_SHAKIBI | فروشگاه لباس ورزشی</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#f4f7f5;
  color:#10201a;
  font-family:Tahoma,Arial,sans-serif;
}

a{
  text-decoration:none;
  color:inherit;
}

button,
input{
  font-family:inherit;
}

.wrap{
  width:min(1150px,92%);
  margin:auto;
}

/* HEADER */

header{
  background:#07130f;
  color:#fff;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 3px 15px #0003;
}

.nav{
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  font-weight:900;
  font-size:21px;
}

.brand b{
  color:#22c982;
}

nav{
  display:flex;
  gap:25px;
  font-size:14px;
}

nav a:hover{
  color:#22c982;
}

/* CART BUTTON */

.cartBtn{
  border:0;
  background:#12a36a;
  color:#fff;
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.cartCount{
  background:#fff;
  color:#08794d;
  border-radius:50%;
  padding:2px 7px;
  margin-right:5px;
}

/* HERO */

.hero{
  background:
  radial-gradient(circle at 80% 20%,#12a36a66,transparent 35%),
  linear-gradient(120deg,#07130f,#0b3828,#12a36a);
  color:white;
  padding:75px 0;
}

.heroGrid{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:35px;
  align-items:center;
}

.hero h1{
  font-size:46px;
  line-height:1.35;
  margin:0 0 20px;
}

.hero em{
  color:#22c982;
  font-style:normal;
}

.hero p{
  line-height:2;
  font-size:17px;
}

.btn{
  display:inline-block;
  background:white;
  color:#08794d;
  padding:13px 22px;
  border-radius:11px;
  font-weight:bold;
}

.art{
  height:300px;
  border-radius:28px;
  background:#06110ccc;
  display:grid;
  place-items:center;
  font-size:75px;
}

/* SECTIONS */

.sec{
  padding:55px 0;
}

.sec h2{
  margin-bottom:25px;
}

/* CATEGORIES */

.cats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.cat{
  background:white;
  border-radius:18px;
  padding:28px;
  text-align:center;
  font-size:42px;
  box-shadow:0 5px 20px #1231;
}

.cat b{
  display:block;
  font-size:15px;
  margin-top:12px;
}

/* PRODUCTS */

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 5px 20px #1231;
}

.photo{
  height:260px;
  background:#e5ece9;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.emoji{
  font-size:75px;
}

.info{
  padding:16px;
}

.info small{
  color:#12a36a;
  font-weight:bold;
}

.info h3{
  margin:9px 0;
  font-size:17px;
}

.price{
  font-weight:900;
  font-size:18px;
  margin:12px 0;
}

.addCart{
  width:100%;
  border:0;
  background:#07130f;
  color:white;
  padding:11px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.addCart:hover{
  background:#12a36a;
}

/* STATUS */

.status{
  text-align:center;
  padding:35px;
  background:white;
  border-radius:16px;
  color:#68756f;
  grid-column:1/-1;
}

/* CONTACT */

.banner{
  background:white;
  padding:30px;
  border-radius:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  box-shadow:0 5px 20px #1231;
}

.banner .btn{
  background:#12a36a;
  color:white;
}

/* CART MODAL */

.cartOverlay{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:500;
  display:none;
}

.cartOverlay.show{
  display:block;
}

.cartPanel{
  position:absolute;
  right:0;
  top:0;
  width:min(430px,100%);
  height:100%;
  background:white;
  padding:22px;
  overflow-y:auto;
}

.cartHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
  padding-bottom:15px;
}

.closeCart{
  border:0;
  background:#eee;
  width:38px;
  height:38px;
  border-radius:50%;
  cursor:pointer;
  font-size:20px;
}

.cartItem{
  display:flex;
  gap:12px;
  padding:15px 0;
  border-bottom:1px solid #eee;
}

.cartImg{
  width:75px;
  height:75px;
  border-radius:10px;
  overflow:hidden;
  background:#e5ece9;
  flex-shrink:0;
}

.cartImg img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.cartDetails{
  flex:1;
}

.cartDetails h4{
  margin:3px 0 8px;
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
}

.qty button{
  border:0;
  background:#07130f;
  color:white;
  width:28px;
  height:28px;
  border-radius:7px;
  cursor:pointer;
}

.remove{
  border:0;
  background:none;
  color:#d33;
  cursor:pointer;
  margin-top:7px;
}

.cartBottom{
  border-top:2px solid #eee;
  margin-top:20px;
  padding-top:20px;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:20px;
  font-weight:900;
}

.checkout{
  width:100%;
  margin-top:15px;
  border:0;
  background:#12a36a;
  color:white;
  padding:14px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  font-size:16px;
}

/* FOOTER */

footer{
  background:#07130f;
  color:#b9c8c1;
  padding:40px 0;
  margin-top:20px;
}

footer a{
  color:#22c982;
}

/* MOBILE */

@media(max-width:900px){

  .grid{
    grid-template-columns:repeat(3,1fr);
  }

  .cats{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:760px){

  nav{
    display:none;
  }

  .heroGrid{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:35px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .photo{
    height:230px;
  }

}

@media(max-width:450px){

  .grid{
    grid-template-columns:1fr;
  }

  .photo{
    height:300px;
  }

  .banner{
    display:block;
  }

}

</style>
</head>
