<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود مدیریت | SPORT_SHAKIBI</title>
<style>body{margin:0;background:#f3f7f5;font-family:Tahoma;display:grid;place-items:center;min-height:100vh}.box{width:min(400px,88%);background:#fff;padding:30px;border-radius:20px;box-shadow:0 10px 35px #0002}h1{font-size:23px}.brand{font-weight:900}.brand b{color:#12a36a}input,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #d5dfdb;font:inherit}button{background:#12a36a;color:#fff;border:0;font-weight:bold}.err{color:#c33;font-size:13px;min-height:22px}</style>
<div class="box"><div class="brand">SPORT_<b>SHAKIBI</b></div><h1>ورود به پنل مدیریت</h1><input id="u" placeholder="نام کاربری"><input id="p" type="password" placeholder="رمز عبور"><button onclick="login()">ورود</button><div class="err" id="e"></div><a href="index.html">بازگشت به فروشگاه</a></div>
<script>async function login(){e.textContent="";let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})});if(r.ok)location.href="admin.html";else e.textContent=(await r.json()).error||"خطا در ورود"}</script>
