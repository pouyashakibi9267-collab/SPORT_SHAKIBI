<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت SPORT_SHAKIBI</title>
<style>body{margin:0;background:#f3f7f5;color:#10201a;font-family:Tahoma}.wrap{width:min(1000px,92%);margin:auto}header{background:#07130f;color:#fff}.top{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900}.brand b{color:#22c982}button,input{font:inherit;border-radius:9px;padding:11px;border:1px solid #d5dfdb}button{cursor:pointer}.out,.del{background:#fff0f0;color:#b33;border-color:#f0cccc}.add{background:#12a36a;color:#fff;border:0}.panel{background:#fff;border-radius:18px;padding:22px;margin:25px 0;box-shadow:0 5px 20px #0001}.form{display:grid;grid-template-columns:1.3fr 1fr 1fr .6fr auto;gap:8px}.item{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid #e7eeeb}.item div{flex:1}.item small{display:block;color:#6c7973;margin-top:4px}.ico{font-size:30px}@media(max-width:720px){.form{grid-template-columns:1fr}.form .add{padding:12px}.item{align-items:flex-start}.top{font-size:13px}}</style>
<header><div class="wrap top"><div class="brand">SPORT_<b>SHAKIBI</b></div><div><a href="index.html" style="color:#fff;margin-left:12px">سایت</a><button class="out" onclick="logout()">خروج</button></div></div></header>
<main class="wrap"><div class="panel"><h1>مدیریت محصولات</h1><p>محصولات اینجا در دیتابیس آنلاین ذخیره می‌شوند و برای همه بازدیدکنندگان قابل نمایش هستند.</p><div class="form"><input id="name" placeholder="نام محصول"><input id="category" placeholder="دسته‌بندی"><input id="price" placeholder="قیمت"><input id="emoji" placeholder="👕"><button class="add" onclick="add()">افزودن</button></div></div>
<div class="panel"><h2>محصولات ثبت‌شده (<span id="count">0</span>)</h2><div id="list"></div></div></main>
<script>
async function load(){let r=await fetch("/api/products");if(r.status===401){location.href="login.html";return}let p=await r.json();count.textContent=p.length;list.innerHTML=p.map(x=>`<div class="item"><span class="ico">${x.emoji||"👕"}</span><div><b>${x.name}</b><small>${x.category} · ${x.price} تومان</small></div><button class="del" onclick="del(${x.id})">حذف</button></div>`).join("")}
  را وارد async function add(){
  const nameEl = document.getElementById("name");
  const categoryEl = document.getElementById("category");
  const priceEl = document.getElementById("price");
  const emojiEl = document.getElementById("emoji");

  const nameValue = nameEl.value.trim();
  const categoryValue = categoryEl.value.trim();
  const priceValue = priceEl.value.trim();
  const emojiValue = emojiEl.value.trim();

  if(!nameValue || !priceValue){
    return alert("نام و قیمت را وارد کنید");
  }

  const r = await fetch("/api/products",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      name:nameValue,
      category:categoryValue || "اسپرت",
      price:priceValue,
      emoji:emojiValue || "👕"
    })
  });

  if(r.ok){
    nameEl.value="";
    categoryEl.value="";
    priceEl.value="";
    emojiEl.value="";
    load();
  }else{
    alert("عملیات ناموفق بود");
  }
  }
async function del(id){if(confirm("این محصول حذف شود؟")){await fetch("/api/products?id="+id,{method:"DELETE"});load()}}
async function logout(){await fetch("/api/logout",{method:"POST"});location.href="login.html"} load();
</script>
